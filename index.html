<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="128x128" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9fafb" />
  </head>
  <body>
    <script>
      // 深浅色初始值：本地显式选择优先，否则跟随浏览器设置。
      // 放在 body 开头、首帧渲染前执行，避免深色用户先看到一闪白屏。
      (() => {
        let mode = null;
        try {
          mode = localStorage.getItem("guide-theme-mode");
        } catch {}
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.body.setAttribute("theme-mode", dark ? "dark" : "light");
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#16161a" : "#f9fafb");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
